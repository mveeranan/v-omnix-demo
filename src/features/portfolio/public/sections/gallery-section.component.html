@if (sortedGallery().length) {
  <section class="pf-section" id="gallery">
    <div class="container mx-auto px-6">
      <div appScrollReveal class="text-center">
        <p class="pf-eyebrow">Gallery</p>
        <h2 class="pf-display mt-2 text-3xl font-semibold md:text-4xl">Product showcase</h2>
      </div>
    </div>

    <!-- Full-bleed 6-across grid — every image visible at once, exact match to
         the reference's "Follow Us On Instagram" gallery (not a rotating slide). -->
    <div class="pf-gallery-grid mt-12">
      @for (item of sortedGallery(); track item.id) {
        <button
          type="button"
          class="pf-gallery-tile"
          [style.background-image]="'url(' + (item.thumbnailUrl || item.url) + ')'"
          [attr.data-type]="item.type"
          (click)="openLightbox(item)"
        >
          <span class="pf-gallery-tile__icon">
            @if (item.type === 'video') {
              <lucide-icon [img]="playIcon" class="h-6 w-6" />
            } @else {
              <lucide-icon [img]="instagramIcon" class="h-6 w-6" />
            }
          </span>
        </button>
      }
    </div>
    <app-gallery-lightbox [item]="lightboxItem()" (close)="closeLightbox()" />
  </section>
}
