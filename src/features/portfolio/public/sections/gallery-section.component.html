@if (sortedGallery().length) {
  <section class="pf-section" id="gallery">
    <div class="container mx-auto px-6">
      <div appScrollReveal class="text-center">
        <p class="pf-eyebrow">Gallery</p>
        <h2 class="pf-display mt-2 text-3xl font-semibold md:text-4xl">Product showcase</h2>
      </div>

      <!-- Slider container -->
      <div class="pf-gallery-slider mt-12">
        @for (item of sortedGallery(); track item.id; let i = $index) {
          <button
            type="button"
            class="pf-gallery-slide"
            [class.pf-gallery-slide--active]="activeIndex() === i"
            [attr.data-type]="item.type"
            (click)="openLightbox(item)"
          >
            @if (item.type === 'video' && !hasImageThumbnail(item)) {
              <video
                [src]="item.url"
                muted
                playsinline
                preload="metadata"
              ></video>
            } @else {
              <img
                [src]="item.thumbnailUrl || item.url"
                [alt]="item.category"
                loading="lazy"
              />
            }
            <div class="pf-gallery-overlay">
              @if (item.type === 'video') {
                <lucide-icon [img]="playIcon" class="h-16 w-16 text-white drop-shadow-lg" />
              } @else {
                <span class="text-lg font-medium text-white">{{ item.category }}</span>
              }
            </div>
            @if (item.featured) {
              <span class="absolute left-4 top-4 rounded bg-black/60 px-3 py-1.5 text-sm font-medium text-white">Featured</span>
            }
          </button>
        }
      </div>
    </div>
    <app-gallery-lightbox [item]="lightboxItem()" (close)="closeLightbox()" />
  </section>
}
