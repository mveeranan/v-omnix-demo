@if (portfolio().stats.enabled && stats().length) {
  <section class="mox-section" id="stats">
    <div class="container mx-auto px-6">
      <div class="mox-stats-band pf-stats-grid rounded-xl">
        @for (stat of stats(); track stat.label) {
          <div class="mox-stats-band__item">
            <p class="mox-stats-band__value">
              {{ stat.value | number }}{{ stat.label === 'Years in business' && stat.value > 0 ? '+' : '' }}
            </p>
            <p class="mox-stats-band__label">{{ stat.label }}</p>
          </div>
        }
      </div>
    </div>
  </section>
}
