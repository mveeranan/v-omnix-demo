<app-admin-page-shell
  eyebrow="Dashboard"
  title="Overview"
  description="Your business at a glance — orders, revenue, and activity.">
  <span
    admin-page-actions
    class="rounded-full border border-[var(--accent)]/30 bg-[var(--accent-muted)] px-2.5 py-0.5 text-[11px] font-semibold text-[var(--accent)]">
    Plan: {{ planLabel() }}
  </span>

  <div class="admin-widget-grid">
    <div class="admin-widget-grid__cell admin-widget-grid__revenue">
      <app-revenue-widget />
    </div>
    <div class="admin-widget-grid__cell admin-widget-grid__branding">
      <app-branding-widget />
    </div>
    <div class="admin-widget-grid__cell admin-widget-grid__customers">
      <app-customers-widget />
    </div>
    <div class="admin-widget-grid__cell">
      <app-onboarding-checklist-widget />
    </div>
  </div>
</app-admin-page-shell>
