<div @pageFadeIn class="admin-page admin-page-shell mx-auto w-full">
  <header class="admin-page__header">
    @if (backLink()) {
      <a [routerLink]="backLink()" class="admin-page__back-link">
        <lucide-icon [img]="backIcon" class="admin-page__back-icon" />
        {{ backLabel() }}
      </a>
    }
    <div class="admin-page__title-row">
      <div>
        <p class="admin-page__eyebrow">{{ eyebrow() }}</p>
        <h1 class="admin-page__title">{{ title() }}</h1>
      </div>
      <ng-content select="[admin-page-actions]" />
    </div>
    <p class="admin-page__description">{{ description() }}</p>
  </header>
  <ng-content />
</div>
