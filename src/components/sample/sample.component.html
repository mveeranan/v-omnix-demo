<div class="bg-white dark:bg-gray-950 scheme-light dark:scheme-dark">
    <div class="col-md-12">
        <h2 class="text-center text-primary">Sample Component Works!</h2>
    </div>
</div>

<form action="" [formGroup]="userInfoForm" (ngSubmit)="userformSubmit()">

    <div class="container col-md-8 mt-4">
        <div class="row mb-3">
            <div class="col-6">
                <label for="">Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" formControlName="name">
                <div class="validation-error"
                    *ngIf="userInfoForm.get('name')?.touched && userInfoForm.get('name')?.invalid">Please enter your
                    name</div>
            </div>
            <div class="col-6">
                <label for="">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" formControlName="email">
                <div class="validation-error"
                    *ngIf="userInfoForm.get('email')?.touched && userInfoForm.get('email')?.invalid">Please enter a
                    valid email</div>
            </div>

            <div class="col-6">
                <label for="">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password"
                    formControlName="password">
                <div class="validation-error" *ngIf="userInfoForm.get('password')?.touched &&
              userInfoForm.get('password')?.errors?.['required']">
                    Password is required
                </div>

                <!-- Min length error -->
                <div class="validation-error" *ngIf="userInfoForm.get('password')?.touched &&
              userInfoForm.get('password')?.errors?.['minlength']">
                    Password must be at least 6 characters long
                </div>
            </div>
            <div class="col-6">
                <label for="">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm your password"
                    formControlName="confirmPassword">
                    <div class="validation-error"
                *ngIf="userInfoForm.get('confirmPassword')?.touched &&
                        userInfoForm.get('confirmPassword')?.errors?.['invalid']">
                please confirm your password
            </div>
            <div class="validation-error"
                *ngIf="userInfoForm.get('confirmPassword')?.touched &&
                        userInfoForm.get('confirmPassword')?.value !== userInfoForm.get('password')?.value">
                Passwords do not match
            </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </div>
    </div>
</form>
