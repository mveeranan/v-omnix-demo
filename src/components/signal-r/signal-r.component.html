<div class="container mt-4">

    <div class="row">
        <div class="col-md-6">
            <h3 style="color: aqua;" class="mb-3">SignalR Chat</h3>
            <div class="form-group">
                <label for="user">User:</label>
                <input type="text" class="form-control" id="user" [(ngModel)]="user">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <input type="text" class="form-control" id="message" [(ngModel)]="message">
            </div>
            <button class="btn btn-primary mt-3" (click)="sendMessage(user, message)">Send Message</button>
        </div>
        <div class="col-md-6">
            <h3 style="text-align: center;">Messages</h3>
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let msg of messageList">
                    <strong>{{ msg.user }}</strong>: {{ msg.message }}
                </li>
            </ul>
        </div>

    </div>

</div>
