@if (portfolio().hero.enabled) {
<section class="mk-hero" id="hero" @heroEnter>
  <div class="container mx-auto px-6">
    <p class="mk-hero__eyebrow hero-item">{{ eyebrow() }}</p>
    <h1 class="mk-hero__title hero-item">{{ headline() }}</h1>
    @if (subheadline()) {
      <p class="mk-hero__subtitle hero-item">{{ subheadline() }}</p>
    }
    <div class="hero-item mt-8 flex flex-wrap justify-center gap-3">
      <a [routerLink]="shopLink()" class="mk-btn mk-btn--primary inline-flex min-h-12 items-center gap-2 px-6">
        <lucide-icon [img]="shopIcon" class="h-5 w-5" />
        {{ portfolio().cta.label || 'Shop now' }}
      </a>
      @if (portfolio().contactSupport.enabled) {
        <a [routerLink]="contactLink()" class="mk-btn mk-btn--outline inline-flex min-h-12 items-center px-6">
          {{ portfolio().hero.secondaryCtaLabel || 'Contact us' }}
        </a>
      }
    </div>
  </div>
</section>
}
