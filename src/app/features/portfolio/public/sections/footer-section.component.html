<footer
  appScrollReveal="fade-up"
  class="pf-footer border-t py-12"
  style="border-color: color-mix(in srgb, var(--pf-text-muted) 35%, transparent)"
>
  <div class="container mx-auto px-6">
    <div class="flex flex-col items-center justify-between gap-8 md:flex-row">
      <div class="text-center md:text-left">
        <p class="pf-display pf-heading text-lg font-semibold">{{ portfolio().brand.businessName }}</p>
        <p class="pf-text-muted mt-1 text-sm">{{ portfolio().brand.tagline }}</p>
      </div>
      <app-pf-social-links [social]="portfolio().social" variant="footer" />
    </div>
    <p class="pf-text-muted mt-8 text-center text-xs">
      © {{ currentYear }} {{ portfolio().brand.businessName }}. All rights reserved.
    </p>
  </div>
</footer>
