<section class="admin-glass-card rounded-xl p-4 sm:p-5">
  <div class="flex flex-col items-center justify-center py-8 text-center sm:py-10">
    <div
      class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-500/10 text-indigo-600 dark:bg-indigo-500/15 dark:text-indigo-400">
      <lucide-icon [img]="icon()" class="h-5 w-5" />
    </div>
    <p class="max-w-md text-sm text-zinc-600 dark:text-zinc-400">{{ hint() }}</p>
    <button type="button" class="admin-section-action-btn mt-4">
      <lucide-icon [img]="plusIcon" class="h-4 w-4 shrink-0" />
      {{ actionLabel() }}
    </button>
  </div>
</section>
