<div
  class="admin-shell-bg flex min-h-screen"
  [style.--admin-modal-inset-left]="modalInsetLeft">
  @if (!isMobile) {
    <div
      class="admin-shell-sidebar hidden shrink-0 md:block"
      [class.admin-shell-sidebar--collapsed]="sidebarCollapsedForView">
      <app-admin-sidebar [collapsed]="sidebarCollapsedForView" />
    </div>
  }

  @if (isMobile && mobileDrawerOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-black/40"
      @backdropFade
      (click)="closeMobileDrawer()"
      aria-label="Close navigation"></button>
    <div class="admin-shell-drawer fixed inset-y-0 left-0 z-50 shadow-2xl" @drawerSlide>
      <app-admin-sidebar [mobile]="true" (closeMobile)="closeMobileDrawer()" />
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-admin-header (menuToggle)="openMobileDrawer()" />
    <main class="admin-main flex-1 overflow-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
