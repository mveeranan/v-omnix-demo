<header class="admin-header sticky top-0 z-40 flex shrink-0 items-center gap-3 px-4 sm:gap-4 sm:px-6">
  <div class="ml-auto flex flex-1 items-center justify-end gap-2 sm:gap-3">
    <div class="relative hidden md:block">
      <lucide-icon [img]="searchIcon" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[var(--text-muted)]" />
      <input
        type="search"
        placeholder="Search orders, customers..."
        class="app-input w-56 py-2 pl-10 pr-3 lg:w-72"
        aria-label="Global search" />
    </div>

    <button
      type="button"
      class="admin-header-action md:hidden"
      (click)="searchExpanded.set(!searchExpanded())"
      aria-label="Toggle search">
      <lucide-icon [img]="searchIcon" class="h-5 w-5" />
    </button>

    <button type="button" class="admin-header-action relative" aria-label="Notifications">
      <lucide-icon [img]="bellIcon" class="h-5 w-5" />
      @if (notificationCount() > 0) {
        <span
          class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-[var(--danger)] px-1 text-[10px] font-bold text-white">
          {{ notificationCount() > 9 ? '9+' : notificationCount() }}
        </span>
      }
    </button>

    <button
      type="button"
      (click)="toggleTheme()"
      class="admin-header-action"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark()) {
        <lucide-icon [img]="sunIcon" class="h-5 w-5" />
      } @else {
        <lucide-icon [img]="moonIcon" class="h-5 w-5" />
      }
    </button>

    <div class="relative">
      <button
        type="button"
        (click)="toggleProfile()"
        class="flex items-center gap-2 rounded-full border border-[var(--border-subtle)] py-1.5 pl-1.5 pr-2 transition-colors hover:bg-[var(--surface-2)]"
        [attr.aria-expanded]="profileOpen()"
        aria-haspopup="true">
        <div
          class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--accent-muted)] text-xs font-semibold text-[var(--accent)]">
          AD
        </div>
        <span class="hidden text-sm font-medium text-[var(--text-primary)] sm:inline">Admin</span>
        <lucide-icon [img]="chevronDown" class="hidden h-4 w-4 text-[var(--text-muted)] sm:block" />
      </button>

      @if (profileOpen()) {
        <div
          class="absolute right-0 top-full z-50 mt-2 w-48 overflow-hidden rounded-lg border border-[var(--border-subtle)] bg-[var(--surface-elevated)] py-1 shadow-[var(--shadow-md)]"
          role="menu">
          <button
            type="button"
            class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-[var(--text-primary)] transition-colors hover:bg-[var(--surface-2)]"
            role="menuitem"
            (click)="goToSettings()">
            <lucide-icon [img]="settingsIcon" class="h-4 w-4" />
            Settings
          </button>
          <button
            type="button"
            class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-[var(--danger)] transition-colors hover:bg-[var(--danger-muted)]"
            role="menuitem"
            (click)="logout()">
            <lucide-icon [img]="logoutIcon" class="h-4 w-4" />
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (searchExpanded()) {
  <div class="border-b border-[var(--border-subtle)] bg-[var(--surface-0)] px-4 py-3 md:hidden">
    <div class="relative">
      <lucide-icon [img]="searchIcon" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[var(--text-muted)]" />
      <input
        type="search"
        placeholder="Search orders, customers..."
        class="app-input w-full py-2 pl-10 pr-3"
        aria-label="Global search mobile" />
    </div>
  </div>
}
