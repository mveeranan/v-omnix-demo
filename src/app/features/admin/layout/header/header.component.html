<header
  class="sticky top-0 z-40 flex h-16 shrink-0 items-center gap-3 border-b border-zinc-200/70 bg-white/75 px-4 backdrop-blur-xl dark:border-zinc-800/80 dark:bg-zinc-950/75 sm:gap-4 sm:px-6">
  <button
    type="button"
    class="admin-header-action lg:hidden"
    (click)="onMenuClick()"
    aria-label="Open navigation menu">
    <lucide-icon [img]="menuIcon" class="h-5 w-5" />
  </button>

  <div class="flex min-w-0 items-center gap-3">
    <app-brand-logo size="sm" gradientId="vOmnixMarkAdminHeader" />
    <div class="hidden min-w-0 sm:block">
      <p class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ tenant().businessName }}</p>
    </div>
  </div>

  <div class="ml-auto flex items-center gap-2 sm:gap-3">
    <div class="relative hidden md:block">
      <lucide-icon [img]="searchIcon" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400" />
      <input
        type="search"
        placeholder="Search bookings, customers..."
        class="w-56 rounded-xl border border-zinc-200 bg-zinc-50 py-2 pl-9 pr-3 text-sm text-zinc-900 outline-none transition-colors placeholder:text-zinc-400 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 lg:w-72 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100 dark:placeholder:text-zinc-500"
        aria-label="Global search" />
    </div>

    <button
      type="button"
      class="admin-header-action md:hidden"
      (click)="searchExpanded.set(!searchExpanded())"
      aria-label="Toggle search">
      <lucide-icon [img]="searchIcon" class="h-5 w-5" />
    </button>

    <button type="button" class="admin-header-action relative" aria-label="Notifications">
      <lucide-icon [img]="bellIcon" class="h-5 w-5" />
      @if (notificationCount() > 0) {
        <span
          class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold text-white">
          {{ notificationCount() > 9 ? '9+' : notificationCount() }}
        </span>
      }
    </button>

    <button
      type="button"
      (click)="toggleTheme()"
      class="admin-header-action"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark()) {
        <lucide-icon [img]="sunIcon" class="h-5 w-5" />
      } @else {
        <lucide-icon [img]="moonIcon" class="h-5 w-5" />
      }
    </button>

    <div class="relative">
      <button
        type="button"
        (click)="toggleProfile()"
        class="flex items-center gap-2 rounded-full border border-zinc-200 py-1.5 pl-1.5 pr-2 transition-colors hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-800"
        [attr.aria-expanded]="profileOpen()"
        aria-haspopup="true">
        <div
          class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-100 text-xs font-semibold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">
          AD
        </div>
        <span class="hidden text-sm font-medium text-zinc-700 sm:inline dark:text-zinc-200">Admin</span>
        <lucide-icon [img]="chevronDown" class="hidden h-4 w-4 text-zinc-500 sm:block" />
      </button>

      @if (profileOpen()) {
        <div
          class="absolute right-0 top-full z-50 mt-2 w-48 overflow-hidden rounded-xl border border-zinc-200 bg-white py-1 shadow-xl dark:border-zinc-700 dark:bg-zinc-900"
          role="menu">
          <button
            type="button"
            class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-zinc-700 transition-colors hover:bg-zinc-50 dark:text-zinc-200 dark:hover:bg-zinc-800"
            role="menuitem"
            (click)="closeProfile()">
            <lucide-icon [img]="userIcon" class="h-4 w-4" />
            Profile
          </button>
          <button
            type="button"
            class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-zinc-700 transition-colors hover:bg-zinc-50 dark:text-zinc-200 dark:hover:bg-zinc-800"
            role="menuitem"
            (click)="closeProfile()">
            <lucide-icon [img]="settingsIcon" class="h-4 w-4" />
            Settings
          </button>
          <button
            type="button"
            class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-rose-600 transition-colors hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-950/30"
            role="menuitem"
            (click)="logout()">
            <lucide-icon [img]="logoutIcon" class="h-4 w-4" />
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (searchExpanded()) {
  <div class="border-b border-zinc-200/70 bg-white/90 px-4 py-3 backdrop-blur-xl md:hidden dark:border-zinc-800 dark:bg-zinc-950/90">
    <div class="relative">
      <lucide-icon [img]="searchIcon" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400" />
      <input
        type="search"
        placeholder="Search bookings, customers..."
        class="w-full rounded-xl border border-zinc-200 bg-zinc-50 py-2 pl-9 pr-3 text-sm outline-none focus:border-indigo-400 dark:border-zinc-700 dark:bg-zinc-900"
        aria-label="Global search mobile" />
    </div>
  </div>
}
