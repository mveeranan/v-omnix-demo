<app-dashboard-widget-shell title="Tenant branding" subtitle="Public-facing identity" [loading]="loading()">
  <div class="flex h-full min-h-0 flex-col justify-between gap-3">
    <div class="flex items-start gap-3">
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-600 text-sm font-bold text-white shadow-md ring-2 ring-white dark:ring-zinc-900">
        {{ tenant().logoInitials }}
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ tenant().businessName }}</p>
        <p class="mt-0.5 line-clamp-2 text-[11px] leading-snug text-zinc-500 dark:text-zinc-400">{{ tenant().tagline }}</p>
      </div>
    </div>

    <div class="rounded-xl border border-zinc-200/80 bg-zinc-50/80 p-2.5 dark:border-zinc-700 dark:bg-zinc-900/50">
      <p class="text-[10px] font-medium uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Brand preview</p>
      <div class="mt-2 flex items-center gap-1.5">
        <span class="h-5 flex-1 rounded-md bg-gradient-to-r from-indigo-500 to-violet-500"></span>
        <span class="h-5 w-5 shrink-0 rounded-md bg-zinc-900 dark:bg-zinc-100"></span>
        <span class="h-5 w-5 shrink-0 rounded-md bg-emerald-500"></span>
      </div>
      <p class="mt-2 truncate rounded-md bg-white px-2 py-1 text-[10px] text-zinc-600 ring-1 ring-zinc-200 dark:bg-zinc-950 dark:text-zinc-300 dark:ring-zinc-700">
        acme.workorbit.app
      </p>
    </div>

    <button
      type="button"
      class="inline-flex w-full items-center justify-center gap-1.5 rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700 transition-colors hover:bg-indigo-100 dark:border-indigo-500/35 dark:bg-indigo-500/15 dark:text-indigo-300 dark:hover:bg-indigo-500/25">
      <lucide-icon [img]="pencilIcon" class="h-3.5 w-3.5" />
      Customize branding
    </button>
  </div>
</app-dashboard-widget-shell>
