<app-dashboard-widget-shell title="Tenant branding" subtitle="Public-facing identity" [loading]="loading()">
  <div class="flex h-full min-h-0 flex-col gap-3">
    <a
      routerLink="/admin/profile"
      class="branding-section branding-section--profile block rounded-xl border border-zinc-200/80 bg-zinc-50/70 p-3 no-underline transition-colors hover:border-indigo-300 hover:bg-indigo-50/60 dark:border-zinc-700 dark:bg-zinc-900/40 dark:hover:border-indigo-500/40 dark:hover:bg-indigo-500/10">
      <p class="admin-widget__section-label">Profile completion</p>
      <div class="mt-2 flex items-center gap-3">
        <div class="completion-ring" [style.--completion]="profileCompletionPercent()">
          <div class="completion-ring__inner">{{ profileCompletionPercent() }}%</div>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-xs font-semibold text-zinc-800 dark:text-zinc-100">Workspace setup progress</p>
          <p class="mt-0.5 text-[11px] text-zinc-500 dark:text-zinc-400">Tap to view profile and complete setup steps.</p>
        </div>
      </div>
    </a>

    <section
      class="branding-section flex min-h-0 flex-1 flex-col justify-between rounded-xl border border-zinc-200/80 bg-zinc-50/70 p-3 dark:border-zinc-700 dark:bg-zinc-900/40">
      <div class="flex items-start gap-3">
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-600 text-sm font-bold text-white shadow-md ring-2 ring-white dark:ring-zinc-900">
          {{ tenant().logoInitials }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ tenant().businessName }}</p>
          <p class="mt-0.5 line-clamp-2 text-[11px] leading-snug text-zinc-500 dark:text-zinc-400">{{ tenant().tagline }}</p>
        </div>
      </div>

      <div class="mt-3 rounded-xl border border-zinc-200/80 bg-zinc-50/80 p-2.5 dark:border-zinc-700 dark:bg-zinc-900/50">
        <p class="admin-widget__section-label">Brand preview</p>
        <div class="mt-2 flex items-center gap-1.5">
          <span class="h-5 flex-1 rounded-md bg-gradient-to-r from-indigo-500 to-violet-500"></span>
          <span class="h-5 w-5 shrink-0 rounded-md bg-zinc-900 dark:bg-zinc-100"></span>
          <span class="h-5 w-5 shrink-0 rounded-md bg-emerald-500"></span>
        </div>
        <p class="mt-2 truncate rounded-md bg-white px-2 py-1 text-[10px] text-zinc-600 ring-1 ring-zinc-200 dark:bg-zinc-950 dark:text-zinc-300 dark:ring-zinc-700">
          acme.workorbit.app
        </p>
      </div>

      <a
        routerLink="/admin/portfolio"
        class="branding-customize-btn mt-3 inline-flex w-full items-center justify-center gap-1.5 rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700 no-underline transition-colors hover:bg-indigo-100 dark:border-indigo-500/35 dark:bg-indigo-500/15 dark:text-indigo-300 dark:hover:bg-indigo-500/25">
        <lucide-icon [img]="pencilIcon" class="h-3.5 w-3.5" />
        Customize branding
      </a>
    </section>
  </div>
</app-dashboard-widget-shell>
