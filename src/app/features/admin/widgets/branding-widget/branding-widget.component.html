<app-dashboard-widget-shell title="Tenant branding" [loading]="loading()">
  <div class="flex h-full items-center gap-3">
    <div
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 text-sm font-bold text-white shadow-sm ring-2 ring-white dark:ring-zinc-900">
      {{ tenant().logoInitials }}
    </div>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-zinc-900 dark:text-zinc-100">{{ tenant().businessName }}</p>
      <button
        type="button"
        class="mt-1.5 inline-flex items-center gap-1 rounded-md border border-zinc-200 bg-white px-2 py-1 text-[11px] font-medium text-zinc-700 transition-colors hover:bg-zinc-50 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-700">
        <lucide-icon [img]="pencilIcon" class="h-3 w-3" />
        Quick edit
      </button>
    </div>
  </div>
</app-dashboard-widget-shell>
