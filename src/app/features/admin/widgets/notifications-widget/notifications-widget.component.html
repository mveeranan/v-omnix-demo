<app-dashboard-widget-shell
  title="Notifications"
  [loading]="loading()"
  [empty]="isEmpty()"
  emptyMessage="All caught up — no new alerts.">
  <div widgetActions>
    <button
      type="button"
      (click)="markAllRead()"
      class="inline-flex items-center gap-0.5 text-[10px] font-medium text-indigo-600 hover:underline dark:text-indigo-400">
      <lucide-icon [img]="markAllIcon" class="h-3 w-3" />
      Mark all
    </button>
  </div>

  <ul class="admin-widget-scroll space-y-1.5">
    @for (notification of notifications(); track notification.id) {
      @if (!notification.read) {
        <li>
          <button
            type="button"
            (click)="markRead(notification.id)"
            class="flex w-full items-start gap-2 rounded-lg border border-indigo-200/80 bg-indigo-50/80 p-2 text-left transition-colors hover:bg-indigo-50 dark:border-indigo-500/25 dark:bg-indigo-950/40 dark:hover:bg-indigo-950/55">
            <div
              class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border"
              [ngClass]="
                notification.type === 'booking'
                  ? 'border-blue-200 bg-blue-50 text-blue-600 dark:border-blue-500/30 dark:bg-blue-500/15 dark:text-blue-300'
                  : 'border-zinc-200 bg-zinc-100 text-zinc-600 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-300'
              ">
              @if (notification.type === 'booking') {
                <lucide-icon [img]="calendarIcon" class="h-3.5 w-3.5" />
              } @else {
                <lucide-icon [img]="bellIcon" class="h-3.5 w-3.5" />
              }
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-xs font-medium text-[var(--text-primary)]">{{ notification.title }}</p>
              <p class="line-clamp-1 text-[11px] text-zinc-600 dark:text-[var(--text-muted)]">{{ notification.message }}</p>
              <p class="mt-0.5 text-[10px] text-zinc-500 dark:text-zinc-500">{{ notification.time }}</p>
            </div>
            <span class="mt-1 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
          </button>
        </li>
      }
    }
  </ul>
</app-dashboard-widget-shell>
