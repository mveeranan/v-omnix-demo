<app-dashboard-widget-shell
  title="Today's schedule"
  subtitle="{{ scheduleDateLabel }}"
  [loading]="loading()"
  [empty]="isEmpty()"
  emptyMessage="No bookings scheduled for today.">
  <span widgetActions class="admin-widget-count-badge">{{ schedule().length }}</span>

  <ul class="admin-widget-scroll admin-widget-list">
    @for (booking of schedule(); track booking.id) {
      <li class="admin-widget-list__item">
        <span class="admin-widget-time">{{ booking.time }}</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-xs font-medium text-[var(--text-primary)]">{{ booking.customer }}</p>
          <p class="truncate text-[11px] text-[var(--text-muted)]">{{ booking.service }}</p>
        </div>
        <span class="admin-status-pill shrink-0 rounded-md px-1.5 py-0.5 text-[9px] font-semibold uppercase {{ statusClass(booking.status) }}">
          {{ statusLabel(booking.status) }}
        </span>
      </li>
    }
  </ul>
</app-dashboard-widget-shell>
