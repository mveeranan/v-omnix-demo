<app-dashboard-widget-shell
  title="Today's schedule"
  [loading]="loading()"
  [empty]="isEmpty()"
  emptyMessage="No bookings scheduled for today.">
  <ul class="admin-widget-scroll divide-y divide-zinc-100 dark:divide-zinc-800">
    @for (booking of schedule(); track booking.id) {
      <li class="flex items-center gap-2 py-2 first:pt-0 last:pb-0">
        <span class="w-11 shrink-0 text-xs font-semibold tabular-nums text-indigo-600 dark:text-indigo-400">{{ booking.time }}</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-xs font-medium text-zinc-900 dark:text-zinc-100">{{ booking.customer }}</p>
          <p class="truncate text-[11px] text-zinc-500 dark:text-zinc-400">{{ booking.service }}</p>
        </div>
        <span class="admin-status-pill shrink-0 rounded px-1.5 py-0.5 text-[9px] font-semibold uppercase {{ statusClass(booking.status) }}">
          {{ statusLabel(booking.status) }}
        </span>
      </li>
    }
  </ul>
</app-dashboard-widget-shell>
