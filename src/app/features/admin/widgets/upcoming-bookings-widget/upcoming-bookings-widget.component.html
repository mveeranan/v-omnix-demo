<app-dashboard-widget-shell
  title="Upcoming bookings"
  [loading]="loading()"
  [empty]="isEmpty()"
  emptyMessage="No upcoming bookings.">
  <ul class="admin-widget-scroll divide-y divide-zinc-100 dark:divide-zinc-800">
    @for (booking of bookings(); track booking.id) {
      <li class="flex items-center gap-2 py-2 first:pt-0">
        <div class="w-12 shrink-0">
          <p class="text-xs font-semibold tabular-nums text-zinc-900 dark:text-zinc-100">{{ booking.time }}</p>
          <p class="text-[10px] leading-tight text-zinc-500 dark:text-zinc-400">{{ booking.dateLabel }}</p>
        </div>
        <div class="min-w-0 flex-1 border-l border-zinc-200 pl-2 dark:border-zinc-700">
          <p class="truncate text-xs font-medium text-zinc-900 dark:text-zinc-100">{{ booking.customer }}</p>
          <p class="truncate text-[11px] text-zinc-500 dark:text-zinc-400">{{ booking.service }}</p>
        </div>
        <span
          class="h-1.5 w-1.5 shrink-0 rounded-full ring-2 ring-white dark:ring-zinc-900"
          [class.bg-emerald-500]="booking.status === 'confirmed'"
          [class.bg-amber-400]="booking.status === 'pending'"></span>
      </li>
    }
  </ul>
</app-dashboard-widget-shell>
