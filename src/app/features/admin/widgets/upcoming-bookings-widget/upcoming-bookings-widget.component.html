<app-dashboard-widget-shell
  title="Upcoming"
  subtitle="Next bookings"
  [loading]="loading()"
  [empty]="isEmpty()"
  emptyMessage="No upcoming bookings scheduled.">
  <span widgetActions class="admin-widget-count-badge">{{ bookings().length }}</span>

  <ul class="admin-widget-scroll admin-widget-list">
    @for (booking of visibleBookings(); track booking.id) {
      <li class="admin-widget-list__item">
        <div class="admin-widget-datetime">
          <p class="text-xs font-semibold tabular-nums text-[var(--text-primary)]">{{ booking.time }}</p>
          <p class="text-[10px] leading-tight text-[var(--text-muted)]">{{ booking.dateLabel }}</p>
        </div>
        <div class="min-w-0 flex-1 border-l border-zinc-200/90 pl-2.5 dark:border-zinc-700">
          <p class="truncate text-xs font-medium text-[var(--text-primary)]">{{ booking.customer }}</p>
          <p class="truncate text-[11px] text-[var(--text-muted)]">{{ booking.service }}</p>
        </div>
        <span
          class="h-2 w-2 shrink-0 rounded-full ring-2 ring-white dark:ring-zinc-900"
          [class.bg-emerald-500]="booking.status === 'confirmed'"
          [class.bg-amber-400]="booking.status === 'pending'"></span>
      </li>
    }
  </ul>
</app-dashboard-widget-shell>
