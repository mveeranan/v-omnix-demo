<article
  class="admin-glass-card admin-widget-hover flex h-full min-h-0 w-full flex-col p-4 sm:p-[1.125rem] {{ className }}"
  [attr.aria-busy]="loading">
  <header class="mb-3 flex shrink-0 items-center justify-between gap-2 border-b border-zinc-100/90 pb-3 dark:border-zinc-800">
    <div class="min-w-0">
      <h3 class="admin-widget__title truncate">{{ title }}</h3>
      @if (subtitle) {
        <p class="admin-widget__subtitle truncate">{{ subtitle }}</p>
      }
    </div>
    <ng-content select="[widgetActions]" />
  </header>

  @if (loading) {
    <div class="flex flex-1 flex-col gap-2 py-4">
      <div class="admin-skeleton h-3.5 w-2/3"></div>
      <div class="admin-skeleton h-7 w-full"></div>
      <div class="admin-skeleton h-3 w-1/2"></div>
      <div class="admin-skeleton mt-1 h-16 w-full flex-1"></div>
    </div>
  } @else if (empty) {
    <div class="flex flex-1 flex-col items-center justify-center gap-2 py-6 text-center">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-full bg-zinc-100 text-zinc-400 dark:bg-zinc-800 dark:text-zinc-500">
        <lucide-icon [img]="emptyIcon" class="h-4 w-4" />
      </div>
      <p class="max-w-[200px] text-xs leading-relaxed text-zinc-500 dark:text-zinc-400">{{ emptyMessage }}</p>
    </div>
  } @else {
    <div class="flex min-h-0 flex-1 flex-col">
      <ng-content />
    </div>
  }
</article>
